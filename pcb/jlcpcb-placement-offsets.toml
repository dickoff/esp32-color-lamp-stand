# JLCPCB/EasyEDA package origins sometimes differ from the physical-body
# origins used by KiCad footprints. Offsets are expressed in footprint-local
# millimetres and rotated with the component when the CPL is exported.

version = 1

[parts.C165948]
footprint = "Connector_USB:USB_C_Receptacle_HRO_TYPE-C-31-M-12"
local_offset_mm = [0.0, 1.424]
expected_references = ["J1"]
reason = "EasyEDA's USB-C model origin differs from the KiCad body origin."
source = "https://easyeda.com/component/df8405e2fa0e40a984c435ad4c8d5cf3"

[parts.C23380830]
footprint = "Package_TO_SOT_SMD:SOT-23-5"
